<!-- 🦞 Q版小龙虾SVG - 最终版 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" id="qlobster">
  <defs>
    <!-- 红色渐变 -->
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FF7A7A"/>
      <stop offset="50%" style="stop-color:#FF5252"/>
      <stop offset="100%" style="stop-color:#D32F2F"/>
    </radialGradient>
    
    <radialGradient id="headGrad" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#FF9999"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </radialGradient>
    
    <!-- 螯渐变 -->
    <linearGradient id="clawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    
    <!-- 足渐变 -->
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C62828"/>
      <stop offset="50%" style="stop-color:#E53935"/>
      <stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    
    <radialGradient id="eyeGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#333"/>
      <stop offset="80%" style="stop-color:#000"/>
      <stop offset="100%" style="stop-color:#111"/>
    </radialGradient>
    
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g id="lobsterBody" filter="url(#dropShadow)">
    
    <!-- ========== 虾须（只有两条，左右各一） ========== -->
    <g id="whiskers">
      <!-- 左虾须 -->
      <path d="M 110 120 C 85 75 55 55 35 75 C 15 95 25 145 45 195 C 60 245 55 295 50 345" 
            stroke="#FF5252" stroke-width="5" fill="none" stroke-linecap="round">
        <animate attributeName="d" 
                 values="M 110 120 C 85 75 55 55 35 75 C 15 95 25 145 45 195 C 60 245 55 295 50 345;
                         M 110 120 C 83 73 53 53 33 73 C 13 93 23 143 43 193 C 58 243 53 293 48 343;
                         M 110 120 C 85 75 55 55 35 75 C 15 95 25 145 45 195 C 60 245 55 295 50 345"
                 dur="3s" repeatCount="indefinite"/>
      </path>
      
      <!-- 右虾须 -->
      <path d="M 190 120 C 215 75 245 55 265 75 C 285 95 275 145 255 195 C 240 245 245 295 250 345" 
            stroke="#FF5252" stroke-width="5" fill="none" stroke-linecap="round">
        <animate attributeName="d"
                 values="M 190 120 C 215 75 245 55 265 75 C 285 95 275 145 255 195 C 240 245 245 295 250 345;
                         M 190 120 C 217 73 247 53 267 73 C 287 93 277 143 257 193 C 242 243 247 293 252 343;
                         M 190 120 C 215 75 245 55 265 75 C 285 95 275 145 255 195 C 240 245 245 295 250 345"
                 dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- ========== 身体 ========== -->
    <g id="body">
      <ellipse cx="150" cy="210" rx="75" ry="70" fill="url(#bodyGrad)"/>
      <!-- 身体纹理 -->
      <path d="M 100 220 Q 150 235 200 220" stroke="#C62828" stroke-width="3" fill="none" opacity="0.4"/>
      <path d="M 110 205 Q 150 218 190 205" stroke="#C62828" stroke-width="3" fill="none" opacity="0.4"/>
      <path d="M 120 190 Q 150 200 180 190" stroke="#C62828" stroke-width="3" fill="none" opacity="0.4"/>
    </g>
    
    <!-- ========== 螯（圆润粗壮的钳子，无圆点） ========== -->
    <g id="claws">
      <!-- 左螯 -->
      <g id="leftClaw" transform="translate(70, 175)">
        <!-- 螯臂 -->
        <path d="M 0 0 Q -30 20 -55 10" stroke="url(#clawGrad)" stroke-width="18" fill="none" stroke-linecap="round">
          <animate attributeName="d"
                   values="M 0 0 Q -30 20 -55 10; M 0 0 Q -33 23 -58 13; M 0 0 Q -30 20 -55 10"
                   dur="2s" repeatCount="indefinite"/>
        </path>
        
        <!-- 螯钳主体 -->
        <g transform="translate(-60, 10) rotate(-12)">
          <!-- 下钳 -->
          <path d="M -5 15 C -20 30 -35 50 -30 65 C -25 75 -10 70 5 55 C 15 45 10 25 5 15 Z" 
                fill="url(#clawGrad)" stroke="#B71C1C" stroke-width="1.5"/>
          <!-- 下钳尖 -->
          <ellipse cx="-32" cy="65" rx="8" ry="12" fill="#B71C1C" transform="rotate(-20 -32 65)"/>
          
          <!-- 上钳 -->
          <g>
            <path d="M -5 -10 C -22 -25 -40 -45 -35 -60 C -30 -70 -12 -65 5 -50 C 18 -38 12 -20 5 -10 Z" 
                  fill="url(#clawGrad)" stroke="#B71C1C" stroke-width="1.5"/>
            <ellipse cx="-37" cy="-60" rx="8" ry="12" fill="#B71C1C" transform="rotate(20 -37 -60)"/>
            
            <animateTransform attributeName="transform" type="rotate"
                              values="0 0 0; -12 0 0; 0 0 0"
                              dur="1.5s" repeatCount="indefinite"/>
          </g>
          
          <animateTransform attributeName="transform" type="rotate"
                            values="-12; -15; -12" dur="1.5s" repeatCount="indefinite"/>
        </g>
      </g>
      
      <!-- 右螯 -->
      <g id="rightClaw" transform="translate(230, 175)">
        <!-- 螯臂 -->
        <path d="M 0 0 Q 30 20 55 10" stroke="url(#clawGrad)" stroke-width="18" fill="none" stroke-linecap="round">
          <animate attributeName="d"
                   values="M 0 0 Q 30 20 55 10; M 0 0 Q 33 23 58 13; M 0 0 Q 30 20 55 10"
                   dur="2s" repeatCount="indefinite"/>
        </path>
        
        <!-- 螯钳主体 -->
        <g transform="translate(60, 10) rotate(12)">
          <!-- 下钳 -->
          <path d="M 5 15 C 20 30 35 50 30 65 C 25 75 10 70 -5 55 C -15 45 -10 25 -5 15 Z" 
                fill="url(#clawGrad)" stroke="#B71C1C" stroke-width="1.5"/>
          <ellipse cx="32" cy="65" rx="8" ry="12" fill="#B71C1C" transform="rotate(20 32 65)"/>
          
          <!-- 上钳 -->
          <g>
            <path d="M 5 -10 C 22 -25 40 -45 35 -60 C 30 -70 12 -65 -5 -50 C -18 -38 -12 -20 -5 -10 Z" 
                  fill="url(#clawGrad)" stroke="#B71C1C" stroke-width="1.5"/>
            <ellipse cx="37" cy="-60" rx="8" ry="12" fill="#B71C1C" transform="rotate(-20 37 -60)"/>
            
            <animateTransform attributeName="transform" type="rotate"
                              values="0 0 0; 12 0 0; 0 0 0"
                              dur="1.5s" repeatCount="indefinite"/>
          </g>
          
          <animateTransform attributeName="transform" type="rotate"
                            values="12; 15; 12" dur="1.5s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
    
    <!-- ========== 腹足（四对，第一对变小下移在钳子下面） ========== -->
    <g id="walkingLegs">
      <!-- 第一对（变小，下移，在钳子下面） -->
      <g id="leg1-left" transform="translate(88, 235)">
        <ellipse cx="0" cy="0" rx="8" ry="20" fill="url(#legGrad)" transform="rotate(-55 0 0)"/>
        <ellipse cx="-12" cy="15" rx="6" ry="12" fill="#B71C1C" transform="rotate(-75 -12 15)"/>
      </g>
      <g id="leg1-right" transform="translate(212, 235)">
        <ellipse cx="0" cy="0" rx="8" ry="20" fill="url(#legGrad)" transform="rotate(55 0 0)"/>
        <ellipse cx="12" cy="15" rx="6" ry="12" fill="#B71C1C" transform="rotate(75 12 15)"/>
      </g>
      
      <!-- 第二对 -->
      <g id="leg2-left" transform="translate(85, 255)">
        <ellipse cx="0" cy="0" rx="10" ry="24" fill="url(#legGrad)" transform="rotate(-50 0 0)"/>
        <ellipse cx="-15" cy="18" rx="7" ry="14" fill="#B71C1C" transform="rotate(-70 -15 18)"/>
      </g>
      <g id="leg2-right" transform="translate(215, 255)">
        <ellipse cx="0" cy="0" rx="10" ry="24" fill="url(#legGrad)" transform="rotate(50 0 0)"/>
        <ellipse cx="15" cy="18" rx="7" ry="14" fill="#B71C1C" transform="rotate(70 15 18)"/>
      </g>
      
      <!-- 第三对 -->
      <g id="leg3-left" transform="translate(90, 275)">
        <ellipse cx="0" cy="0" rx="9" ry="22" fill="url(#legGrad)" transform="rotate(-45 0 0)"/>
        <ellipse cx="-16" cy="16" rx="6" ry="13" fill="#B71C1C" transform="rotate(-65 -16 16)"/>
      </g>
      <g id="leg3-right" transform="translate(210, 275)">
        <ellipse cx="0" cy="0" rx="9" ry="22" fill="url(#legGrad)" transform="rotate(45 0 0)"/>
        <ellipse cx="16" cy="16" rx="6" ry="13" fill="#B71C1C" transform="rotate(65 16 16)"/>
      </g>
      
      <!-- 第四对 -->
      <g id="leg4-left" transform="translate(98, 290)">
        <ellipse cx="0" cy="0" rx="8" ry="20" fill="url(#legGrad)" transform="rotate(-40 0 0)"/>
        <ellipse cx="-15" cy="14" rx="5" ry="11" fill="#B71C1C" transform="rotate(-60 -15 14)"/>
      </g>
      <g id="leg4-right" transform="translate(202, 290)">
        <ellipse cx="0" cy="0" rx="8" ry="20" fill="url(#legGrad)" transform="rotate(40 0 0)"/>
        <ellipse cx="15" cy="14" rx="5" ry="11" fill="#B71C1C" transform="rotate(60 15 14)"/>
      </g>
    </g>
    
    <!-- ========== 头部 ========== -->
    <g id="head">
      <path d="M 85 145 Q 150 115 215 145 Q 205 185 150 190 Q 95 185 85 145" 
            fill="url(#headGrad)"/>
      <ellipse cx="125" cy="140" rx="28" ry="18" fill="#FFB3B3" opacity="0.5"/>
    </g>
    
    <!-- ========== 大眼睛（无腮红） ========== -->
    <g id="eyes">
      <!-- 左眼柄 -->
      <line x1="110" y1="150" x2="100" y2="115" stroke="#FF6B6B" stroke-width="10" stroke-linecap="round"/>
      
      <!-- 右眼柄 -->
      <line x1="190" y1="150" x2="200" y2="115" stroke="#FF6B6B" stroke-width="10" stroke-linecap="round"/>
      
      <!-- 左眼球 -->
      <g id="leftEye">
        <circle cx="100" cy="100" r="30" fill="white" stroke="#FF6B6B" stroke-width="3"/>
        <circle cx="100" cy="100" r="20" fill="url(#eyeGrad)"/>
        <circle cx="106" cy="94" r="9" fill="white" opacity="0.9"/>
        <circle cx="94" cy="106" r="5" fill="white" opacity="0.5"/>
        
        <!-- 眨眼 -->
        <ellipse cx="100" cy="100" rx="30" ry="0" fill="#FF6B6B" opacity="0">
          <animate attributeName="ry" values="0;0;30;0;0" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" dur="4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      
      <!-- 右眼球 -->
      <g id="rightEye">
        <circle cx="200" cy="100" r="30" fill="white" stroke="#FF6B6B" stroke-width="3"/>
        <circle cx="200" cy="100" r="20" fill="url(#eyeGrad)"/>
        <circle cx="206" cy="94" r="9" fill="white" opacity="0.9"/>
        <circle cx="194" cy="106" r="5" fill="white" opacity="0.5"/>
        
        <!-- 眨眼 -->
        <ellipse cx="200" cy="100" rx="30" ry="0" fill="#FF6B6B" opacity="0">
          <animate attributeName="ry" values="0;0;30;0;0" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;0;0" dur="4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>
    
    <!-- ========== 嘴巴 ========== -->
    <g id="mouth">
      <path d="M 135 170 Q 150 180 165 170" stroke="#B71C1C" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M 140 173 Q 150 183 160 173" stroke="#FF8A8A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>
    
    <!-- ========== 尾巴（最后绘制，确保可见） ========== -->
    <g id="tail" transform="translate(150, 300)">
      <!-- 尾节1（最大） -->
      <g class="tail-segment" id="tail1">
        <ellipse cx="0" cy="0" rx="58" ry="45" fill="url(#tailGrad)"/>
        <ellipse cx="0" cy="0" rx="48" ry="36" fill="none" stroke="#B71C1C" stroke-width="2" opacity="0.3"/>
        <!-- 尾扇 -->
        <path d="M -18 -40 L 0 -70 L 18 -40 Z" fill="#B71C1C"/>
        <ellipse cx="-25" cy="-35" rx="12" ry="20" fill="#B71C1C" transform="rotate(-30 -25 -35)"/>
        <ellipse cx="25" cy="-35" rx="12" ry="20" fill="#B71C1C" transform="rotate(30 25 -35)"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-5 0 45; 5 0 45; -5 0 45"
                          dur="2s" repeatCount="indefinite"/>
      </g>
      
      <!-- 尾节2 -->
      <g class="tail-segment" id="tail2" transform="translate(0, -55)">
        <ellipse cx="0" cy="0" rx="52" ry="38" fill="url(#tailGrad)"/>
        <ellipse cx="0" cy="0" rx="42" ry="30" fill="none" stroke="#B71C1C" stroke-width="2" opacity="0.3"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-3 0 38; 3 0 38; -3 0 38"
                          dur="1.8s" repeatCount="indefinite"/>
      </g>
      
      <!-- 尾节3 -->
      <g class="tail-segment" id="tail3" transform="translate(0, -98)">
        <ellipse cx="0" cy="0" rx="47" ry="33" fill="url(#tailGrad)"/>
        <ellipse cx="0" cy="0" rx="37" ry="26" fill="none" stroke="#B71C1C" stroke-width="2" opacity="0.3"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-4 0 33; 4 0 33; -4 0 33"
                          dur="1.6s" repeatCount="indefinite"/>
      </g>
      
      <!-- 尾节4（连接身体） -->
      <g class="tail-segment" id="tail4" transform="translate(0, -135)">
        <ellipse cx="0" cy="0" rx="42" ry="28" fill="url(#tailGrad)"/>
        <ellipse cx="0" cy="0" rx="32" ry="22" fill="none" stroke="#B71C1C" stroke-width="2" opacity="0.3"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-2 0 28; 2 0 28; -2 0 28"
                          dur="1.5s" repeatCount="indefinite"/>
      </g>
    </g>
    
    <!-- 整体摇摆 -->
    <animateTransform attributeName="transform" type="rotate"
                      values="-1 150 210; 1 150 210; -1 150 210"
                      dur="3s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
