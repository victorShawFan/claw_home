<!-- 🦞 小龙虾SVG图标 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#EE5A5A"/>
    </linearGradient>
    <linearGradient id="tailGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#CC4444"/>
    </linearGradient>
  </defs>
  
  <!-- 尾巴 -->
  <ellipse cx="100" cy="160" rx="35" ry="25" fill="url(#tailGradient)"/>
  <ellipse cx="100" cy="140" rx="30" ry="20" fill="url(#tailGradient)"/>
  <ellipse cx="100" cy="120" rx="25" ry="18" fill="url(#tailGradient)"/>
  
  <!-- 身体 -->
  <ellipse cx="100" cy="90" rx="45" ry="40" fill="url(#bodyGradient)"/>
  
  <!-- 眼睛 -->
  <circle cx="80" cy="65" r="12" fill="white"/>
  <circle cx="120" cy="65" r="12" fill="white"/>
  <circle cx="80" cy="65" r="6" fill="#333"/>
  <circle cx="120" cy="65" r="6" fill="#333"/>
  <circle cx="82" cy="63" r="2" fill="white"/>
  <circle cx="122" cy="63" r="2" fill="white"/>
  
  <!-- 嘴巴 -->
  <path d="M 90 100 Q 100 110 110 100" stroke="#CC4444" stroke-width="3" fill="none"/>
  
  <!-- 腮红 -->
  <circle cx="65" cy="85" r="8" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="135" cy="85" r="8" fill="#FFB6C6" opacity="0.6"/>
  
  <!-- 左螯 -->
  <path d="M 55 80 Q 30 60 25 40" stroke="#FF6B6B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="25" cy="35" rx="12" ry="18" fill="#FF6B6B"/>
  <ellipse cx="25" cy="35" rx="8" ry="12" fill="#FF8A8A"/>
  
  <!-- 右螯 -->
  <path d="M 145 80 Q 170 60 175 40" stroke="#FF6B6B" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="175" cy="35" rx="12" ry="18" fill="#FF6B6B"/>
  <ellipse cx="175" cy="35" rx="8" ry="12" fill="#FF8A8A"/>
  
  <!-- 触须 -->
  <path d="M 85 55 Q 70 30 60 20" stroke="#FF6B6B" stroke-width="2" fill="none"/>
  <path d="M 115 55 Q 130 30 140 20" stroke="#FF6B6B" stroke-width="2" fill="none"/>
</svg>
