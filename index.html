<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 Claw Home - 小龙虾之家</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 🎵 冒险岛BGM -->
    <audio id="bgm" loop>
        <source src="https://archive.org/download/maplestory-bgm/MapleStory%20BGM%20-%20Lith%20Harbor.mp3" type="audio/mpeg">
    </audio>
    
    <!-- 音效 -->
    <audio id="sound-feed" preload="auto">
        <source src="https://www.soundjay.com/buttons/sounds/button-09.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-play" preload="auto">
        <source src="https://www.soundjay.com/buttons/sounds/button-10.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-pet" preload="auto">
        <source src="https://www.soundjay.com/buttons/sounds/button-29.mp3" type="audio/mpeg">
    </audio>

    <!-- 顶部横条 -->
    <header class="top-bar">
        <div class="logo">
            <span class="lobster-icon">🦞</span>
            <span class="title">Claw Home</span>
        </div>
        <div class="top-center">
            <span class="system-status">
                <span class="status-indicator online"></span>
                <span class="status-text">在线</span>
            </span>
        </div>
        <div class="top-controls">
            <button class="music-toggle" id="musicToggle" onclick="toggleMusic()" title="播放/暂停BGM">
                <span id="musicIcon">🎵</span>
            </button>
            <button class="day-night-toggle" id="dayNightToggle" onclick="toggleDayNight()" title="切换昼夜模式">
                <span class="toggle-icon" id="toggleIcon">☀️</span>
            </button>
        </div>
    </header>

    <!-- 主布局 -->
    <div class="main-layout">
        <!-- 左侧状态条 -->
        <aside class="left-sidebar">
            <div class="sidebar-section">
                <h4>📊 状态</h4>
                <div class="sidebar-item">
                    <span id="mainStatus">干活中 🔨</span>
                </div>
            </div>
            <div class="sidebar-section">
                <h4>⚡ 能量</h4>
                <div class="energy-bar-vertical">
                    <div class="energy-fill-vertical" id="energyFill" style="height: 85%"></div>
                </div>
                <span class="energy-text" id="energyText">85%</span>
            </div>
            <div class="sidebar-section">
                <h4>😊 心情</h4>
                <div class="sidebar-item" id="mood">开心</div>
            </div>
            <div class="sidebar-section">
                <h4>⏱️ 运行</h4>
                <div class="sidebar-item" id="uptime">0小时0分</div>
            </div>
        </aside>

        <!-- 中央游戏区域 -->
        <main class="center-stage">
            <!-- 天气信息（右上角） -->
            <div class="weather-display" id="weatherDisplay">
                <div class="weather-icon" id="weatherIcon">☀️</div>
                <div class="weather-info">
                    <div class="weather-temp" id="weatherTemp">--°C</div>
                    <div class="weather-city">深圳</div>
                    <div class="weather-desc" id="weatherDesc">加载中...</div>
                    <div class="weather-time" id="weatherTime">--:--</div>
                </div>
            </div>

            <!-- 场景 - 海洋书房 -->
            <div class="scene" id="scene">
                <div class="ocean-room-bg">
                    <!-- 海蓝色墙纸 -->
                    <div class="ocean-wall"></div>
                    <!-- 沙滩地板 -->
                    <div class="ocean-floor"></div>
                    <!-- 舷窗 -->
                    <div class="porthole-window" id="officeWindow">
                        <div class="fish-outside">🐠</div>
                    </div>
                    <!-- 书架 -->
                    <div class="bookshelf">
                        <div class="shell-book"></div>
                        <div class="shell-book"></div>
                        <div class="shell-book"></div>
                        <div class="shell-book"></div>
                        <div class="shell-book"></div>
                    </div>
                    <!-- 海藻海草 -->
                    <div class="seaweed-plant tall"></div>
                    <div class="seaweed-plant medium"></div>
                    <div class="seaweed-plant short"></div>
                    <div class="seaweed-plant curly"></div>
                    <!-- 珊瑚礁书桌 -->
                    <div class="coral-desk"></div>
                    <!-- 笔记本电脑 -->
                    <div class="laptop">
                        <div class="laptop-logo"></div>
                    </div>
                </div>

                <!-- 天气效果层（窗外） -->
                <div class="weather-effects" id="weatherEffects">
                    <div class="rain-container" id="rainContainer"></div>
                    <div class="snow-container" id="snowContainer"></div>
                    <div class="clouds-container" id="cloudsContainer"></div>
                </div>

                <!-- 小龙虾容器 -->
                <div class="lobsters-container" id="lobstersContainer">
                    <!-- 主小龙虾 -->
                    <div class="lobster main-lobster" id="mainLobster" data-status="idle">
                        <div class="lobster-sprite" id="lobsterSprite">
                            <!-- SVG将通过JS动态加载 -->
                        </div>
                        
                        <!-- 状态标签 -->
                        <div class="status-tag" id="mainStatusTag">
                            <span class="status-icon">😊</span>
                            <span class="status-text">待机中</span>
                        </div>

                        <!-- 气泡对话框 -->
                        <div class="speech-bubble" id="speechBubble">
                            <p>欢迎来到小龙虾办公室！🦞</p>
                        </div>
                    </div>

                    <!-- 子agent龙虾 -->
                    <div class="sub-lobsters-area" id="subLobstersArea"></div>
                </div>
            </div>
        </main>

        <!-- 右侧状态条 -->
        <aside class="right-sidebar">
            <div class="sidebar-section">
                <h4>👥 子Agent</h4>
                <div class="sub-agents-compact" id="subAgentsCompact">
                    <span class="empty-text">无</span>
                </div>
            </div>
            <div class="sidebar-section">
                <h4>📋 最近任务</h4>
                <div class="task-list-compact" id="taskListCompact">
                    <div class="task-compact">等待任务...</div>
                </div>
            </div>
            <div class="sidebar-section">
                <h4>📈 今日</h4>
                <div class="mini-stats">
                    <div class="mini-stat">
                        <span class="mini-label">任务</span>
                        <span class="mini-value" id="todayTasks">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="mini-label">技能</span>
                        <span class="mini-value">33</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 底部互动条 -->
    <footer class="bottom-bar">
        <div class="action-buttons">
            <button class="action-btn feed" onclick="interact('feed')">
                <span class="btn-icon">🍤</span>
                <span class="btn-text">喂食</span>
            </button>
            <button class="action-btn play" onclick="interact('play')">
                <span class="btn-icon">🎾</span>
                <span class="btn-text">玩耍</span>
            </button>
            <button class="action-btn pet" onclick="interact('pet')">
                <span class="btn-icon">👋</span>
                <span class="btn-text">抚摸</span>
            </button>
            <button class="action-btn check" onclick="interact('check')">
                <span class="btn-icon">🔍</span>
                <span class="btn-text">查看</span>
            </button>
        </div>
        <div class="footer-info">
            <span>🦞 Claw Home v1.2</span>
            <span class="separator">|</span>
            <span id="connectionStatus" class="connected">🟢 已连接</span>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
